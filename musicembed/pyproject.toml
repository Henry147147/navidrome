[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navidrome-embedder"
version = "1.0.0"
description = "Navidrome embedder helper CLI (Python)."
requires-python = ">=3.10,<3.14"
dependencies = ["muq (==0.1.0)", "pymilvus (>=2.6,<3.0)", "torch (>=2.9.1,<2.10.0)", "torchaudio (>=2.9.1,<2.10.0)"]

[tool.setuptools]
script-files = ["navidrome-embedder.py"]

[[tool.poetry.source]]
name = "pytorch_repo"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"


[[tool.poetry.source]]
name = "pytorch_nightly_repo"
url = "https://download.pytorch.org/whl/nightly/cu128"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch_repo"}
torchaudio = {source = "pytorch_repo"}
torchvision = {source = "pytorch_repo"}
